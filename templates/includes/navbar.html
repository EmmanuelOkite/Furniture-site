{% load static %}
{% with current=request.resolver_match.url_name %}
<header class="site-header" data-site-header>
    <div class="site-header__bar container">
        <a href="{% url 'home' %}" class="brand" aria-label="Sam Stunning Furniture, home">
            <img class="brand__mark" src="{% static 'images/logo-mark.png' %}" width="73" height="80" alt="">
            <span class="brand__name">Sam Stunning <span class="brand__sub">Furniture</span></span>
        </a>

        <nav class="main-nav" id="main-nav" aria-label="Main navigation" data-main-nav>
            <ul class="main-nav__list">
                <li><a href="{% url 'home' %}" class="main-nav__link"{% if current == 'home' %} aria-current="page"{% endif %}>Home</a></li>
                <li><a href="#" class="main-nav__link">Shop</a></li>
                <li><a href="#" class="main-nav__link">Categories</a></li>
                <li><a href="#" class="main-nav__link">About Us</a></li>
                <li><a href="#" class="main-nav__link">Contact</a></li>
                <li class="main-nav__item--mobile"><a href="#" class="main-nav__link">My Account</a></li>
            </ul>
        </nav>

        <div class="header-actions">
            <button type="button" class="icon-button" aria-label="Search" aria-expanded="false" aria-controls="site-search" data-search-toggle>
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
            </button>
            <a href="#" class="icon-button" aria-label="My account">
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></svg>
            </a>
            <button type="button" class="icon-button menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="main-nav" data-menu-toggle>
                <span class="menu-toggle__lines" aria-hidden="true"></span>
            </button>
        </div>
    </div>

    <div class="site-search" id="site-search" data-site-search hidden>
        <form class="site-search__form container" action="{% url 'search' %}" method="get" role="search">
            <label for="site-search-input" class="visually-hidden">Search furniture</label>
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
            <input type="search" id="site-search-input" name="q" placeholder="Search sofas, chairs, tables…" autocomplete="off" maxlength="100" required>
            <button type="submit" class="button button--primary button--small">Search</button>
        </form>
    </div>
</header>
{% endwith %}
