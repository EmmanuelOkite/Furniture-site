{% if form.non_field_errors %}
<div class="form-alert form-alert--error" role="alert">
    {% for error in form.non_field_errors %}<p>{{ error }}</p>{% endfor %}
</div>
{% elif form.errors %}
<div class="form-alert form-alert--error" role="alert">
    <p>Please correct the highlighted field{{ form.errors|length|pluralize }} below.</p>
</div>
{% endif %}
