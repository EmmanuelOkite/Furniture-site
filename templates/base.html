{% load static %}<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sam's Stunning Furniture{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Sam's Stunning Furniture, Kyanja, Kampala: thoughtfully designed furniture for every room of your home.{% endblock %}">
    <meta name="theme-color" content="#F7F3EC">
    <link rel="icon" href="{% static 'images/favicon.svg' %}" type="image/svg+xml">

    <script>document.documentElement.classList.replace("no-js", "js");</script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap">

    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <a class="skip-link" href="#main-content">Skip to main content</a>

    {% include "includes/navbar.html" %}

    <main id="main-content">
        {% block content %}{% endblock %}
    </main>

    {% include "includes/footer.html" %}

    <script src="{% static 'js/main.js' %}" defer></script>
</body>
</html>
